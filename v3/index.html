<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>NEON HORIZON — claim your building in the city</title>
<meta name="description" content="Every follower gets a building in a futuristic neon city. Find your building, build it, upgrade it, share it.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏙️</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="nh-loader" style="position:fixed;inset:0;z-index:99999;background:#05030f;display:flex;flex-direction:column;align-items:center;justify-content:center;font:600 16px system-ui,sans-serif;color:#e8f6ff;transition:opacity .5s">
  <div style="font-size:26px;letter-spacing:4px;color:#ff3ec8;text-shadow:0 0 12px #ff3ec8">NEON HORIZON</div>
  <div style="margin:18px 0 8px;width:min(70vw,320px);height:8px;border-radius:4px;background:#1b1433;overflow:hidden"><i id="nh-bar" style="display:block;height:100%;width:3%;background:linear-gradient(90deg,#29e6ff,#ff3ec8);transition:width .3s"></i></div>
  <div id="nh-pct">Loading… 0%</div>
</div>
<div id="app">
  <div id="sky-bg"></div>
  <div id="stars"></div>
  <div id="map-viewport"></div>
  <div id="light-streaks"></div>
  <div class="vignette"></div>

  <header id="app-header">
    <div class="header-row">
      <div class="pill brand-pill">
        <span class="brand-name" id="brand-name">NEON HORIZON</span>
        <span class="brand-tag" id="brand-tag">A NEON HORIZON PROJECT</span>
      </div>
      <div class="header-right">
        <button class="pill coins-btn" id="coins-btn">🪙 <span id="coins-balance">0</span></button>
        <select id="lang-picker" aria-label="Language"></select>
        <button class="icon-btn" id="settings-btn" title="Settings">⚙️</button>
      </div>
    </div>
    <div class="header-row" id="hud-row">
      <div class="pill hidden" id="level-pill"><span id="lvl-badge">1</span><div class="lvl-col"><span id="lvl-nick"></span><div class="xp-bar"><i id="xp-fill"></i></div><span id="lvl-xp"></span></div></div>
      <button class="pill hud-btn" id="biz-btn" title="Businesses">🏢</button>
      <button class="pill hud-btn" id="quests-btn" title="Quests">🎯<span class="hud-dot hidden" id="quests-dot">0</span></button>
      <button class="pill hud-btn" id="invite-btn" title="Invite friends">👥</button>
      <button class="pill hud-btn faq-btn" id="faq-btn" title="FAQ">FAQ</button>
    </div>
    <div class="header-row">
      <div class="pill residents-pill">🏙️ <strong id="residents-count">—</strong> <span id="residents-label">residents</span></div>
      <div class="pill newtoday-pill" id="newtoday-pill">✨ New today: <strong id="new-today">0</strong> buildings</div>
    </div>
  </header>

  <div id="bottom-bar">
    <span class="at">@</span>
    <input id="search-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="your_handle">
    <button id="find-btn">Find my building</button>
  </div>

  <div id="modal-root"></div>
</div>

<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js" } }
</script>
<script type="module">
import { DefaultLoadingManager as M } from 'three';
const bar=document.getElementById('nh-bar'), pct=document.getElementById('nh-pct'), el=document.getElementById('nh-loader');
let shown=3; const set=p=>{p=Math.max(shown,Math.min(99,Math.round(p)));shown=p;bar.style.width=p+'%';pct.textContent='Loading… '+p+'%';};
M.onProgress=(u,l,t)=>set(l/t*100);
const done=()=>{bar.style.width='100%';pct.textContent='100%';el.style.opacity='0';setTimeout(()=>el.remove(),600);};
const t0=Date.now();(function poll(){const w=window.App&&App.renderer&&App.renderer.world;if((w&&w.groundTraffic&&w.groundTraffic.ready&&w.flyingCars&&w.flyingCars.ready)||Date.now()-t0>60000)return done();setTimeout(poll,250);})();
</script>
<script type="module" src="js/countries.js"></script>
<script type="module" src="js/i18n_game.js"></script>
<script type="module" src="js/i18n_faq.js"></script>
<script type="module" src="js/i18n.js"></script>
<script type="module" src="js/store.js"></script>
<script type="module" src="js/economy.js"></script>
<script type="module" src="js/city.js"></script>
<script type="module" src="world/main.js"></script>
<script type="module" src="config/payment-links.js"></script>
<script type="module" src="js/qr.js"></script>
<script type="module" src="js/game.js"></script>
<script type="module" src="js/ui.js"></script>
<script type="module" src="js/panels.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
